<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">

  <head>

    <link rel="stylesheet" href="/assets/css/all.css">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="https://code.jquery.com/jquery-3.3.0.min.js" integrity="sha256-RTQy8VOmNlT6b2PIRur37p6JEBZUE7o8wPgMvu18MC4=" crossorigin="anonymous"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <!--[if lt IE 9]>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js" integrity="sha256-3Jy/GbSLrg0o9y5Z5n1uw0qxZECH7C6OQpVBgNFYa0g=" crossorigin="anonymous"></script>
    <![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  </head>

    <body>
      <header>
        <h1>{{ site.title | default: site.github.repository_name }}</h1>

        <ul>
            <li><a href="{{ site.url }}" class="softbutton">Home</a></li>
            <li><a href="{{ site.url }}Resources" class="softbutton">Resources</a></li>
            <li><a href="{{ site.url }}Posts" class="softbutton">Blogs</a></li>
        </ul>
      </header>
    
    <div class="wrapper">
        {% if page.sidebar %}
      <nav>
        <ul></ul>
      </nav>
        {% endif %}

        {% if page.navbar %}
      <sitenav>
        <ul>
            <li> <a href="javascript:history.back()">Home</a> </li>
            <li> <a href="javascript:history.back()">Blogs</a> </li>
        
        </ul>
      </sitenav>
        {% endif %}


      <section>
        {{ content }}
      </section>
      <footer>
          <ul>
              <li><a href="https://github.com/XinyuHua/"><i class="fa fa-github fa-2x" style=" vertical-align: middle;"></i></a></li>
              <li><a href="https://twitter.com/xinyu_hua_neu"><i class="fa fa-twitter fa-2x" style=" vertical-align: middle;"></i></a></li>
              <li><a href="mailto:hua.x@northeastern.edu"><i class="fa fa-envelope fa-2x" style=" vertical-align: middle;"></i></a></li>
         </ul>
      </footer>

     

    </div>

    {% if site.google_analytics %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
  </body>

    <script type='text/javascript' id='clustrmaps' src='{{ base.url | prepend: site.url }}/resources/js/clustrmap.js'></script>


</html>
