# Title of your blog; shows in the header
name: "xinyuhua.IO"

# Description of your content (will only be used on Google Search)
description: "This site is derived from Materi theme, thanks to ogaclejapan"

# Your name. Will show in your footer + sidebar
author: "Xinyu Hua"
lang: ja
timezone: Asia/Shanghai

url: "http://xinyuhua.github.io"
baseurl: ""

# A short presentation of yourself. Will show in the sidebar, under your name. Best usage would be between 30 to 50 words.
author-bio: " Junior year student in SJTU, this is my first blog, and this blog is derived from Jekyll theme Materi, which is the work of ogaclejapan"

# Social Accounts (mine, as placeholders)

twitter: 
github: xinyuhua
dribbble:
instagram:
googleplus: 107580920695347076057

# Google Analytics (you may want to changes these with yours or even delete :)

ga_domain: www.ogaclejapan.com
ga_tracking_id: UA-37241684-3

# Other (refer to http://jekyllrb.com/docs/home/ for further details on the below)

markdown: redcarpet
permalink: pretty
highlighter: pygments

paginate: 10
paginate_path: "/page/:num"

# SCSS

sass:
  sass_dir: _scss
  style: :compressed

# Redcarpet
redcarpet:
  extensions: ["strikethrough", "tables", "fenced_code_blocks", "autolink"]

# Exclude Files
exclude: ["README.md", ".gitignore", "Gemfile", "Gemfile.lock", "art"]

# Gems
gems:
  - jekyll-redirect-from
